<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Item // Editor — Badge Archive</title>
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="../src/assets/img/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #000; --bg-card: #0C130E; --bg-inset: #0A0A0A;
      --fg: #E0E0E0; --fg-muted: #94A3B8; --fg-dim: #5B6B60;
      --border: #1F1F1F; --border-strong: #2E4434;
      --primary: #00FF41; --primary-dim: rgba(0,255,65,.13);
      --accent: #FF3333;
      --font: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.5; height: 100dvh; display: flex; flex-direction: column; }
    a { color: var(--primary); }

    header { display: flex; align-items: center; gap: 1rem; border-bottom: 1px solid var(--border); padding: .7rem 1.2rem; }
    header h1 { font-size: 16px; margin: 0; font-weight: 800; letter-spacing: .05em; }
    header .dim { color: var(--fg-dim); }
    header .spacer { flex: 1; }
    button { font: inherit; cursor: pointer; background: none; border: 1px solid var(--border-strong); color: var(--fg-muted); padding: .45rem .9rem; border-radius: 4px; min-height: 36px; }
    button:hover { color: var(--fg); border-color: var(--fg-muted); }
    button.primary { color: var(--primary); border-color: var(--primary); background: var(--primary-dim); }
    button.primary:disabled { opacity: .4; cursor: not-allowed; }
    button.danger:hover { color: var(--accent); border-color: var(--accent); }
    :focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }

    main { flex: 1; display: grid; grid-template-columns: 290px 1fr; min-height: 0; }

    /* дерево слева */
    aside { border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
    .tree-search { padding: .7rem .8rem; border-bottom: 1px solid var(--border); }
    .tree-search input { width: 100%; background: var(--bg-inset); border: 1px solid var(--border); color: var(--fg); font: inherit; padding: .45rem .6rem; border-radius: 4px; }
    .tree { flex: 1; overflow-y: auto; padding: .6rem .4rem 1.5rem; }
    .tree .group-label { color: var(--fg-dim); font-size: 11px; text-transform: uppercase; letter-spacing: .14em; padding: .55rem .5rem .25rem; }
    .tree .branch { margin: .1rem 0 .1rem .2rem; }
    .tree details { margin-left: 1rem; }
    .tree summary { cursor: pointer; color: var(--fg-muted); padding: .2rem .3rem; list-style: none; user-select: none; }
    .tree summary::before { content: "▸ "; color: var(--fg-dim); }
    .tree details[open] > summary::before { content: "▾ "; }
    .tree summary:hover { color: var(--fg); }
    .tree .leaf { display: block; width: 100%; text-align: left; border: none; color: var(--fg-muted); padding: .25rem .4rem .25rem 1.4rem; border-radius: 4px; min-height: 28px; }
    .tree .leaf:hover { color: var(--fg); background: var(--bg-inset); }
    .tree .leaf.active { color: var(--primary); background: var(--primary-dim); }
    .tree .leaf .yr { color: var(--fg-dim); font-size: 11px; margin-left: .4rem; }

    /* форма справа */
    section { overflow-y: auto; padding: 1.4rem 2rem 4rem; display: grid; grid-template-columns: minmax(0, 980px) minmax(230px, 280px); gap: 0 2rem; align-items: start; }
    section > * { min-width: 0; }
    @media (max-width: 1150px) { section { grid-template-columns: minmax(0, 1fr); } .suggest-panel { display: none; } }
    .empty { color: var(--fg-dim); padding-top: 3rem; text-align: center; grid-column: 1 / -1; }
    .form-head { display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.2rem; }
    .form-head h2 { margin: 0; font-size: 18px; }
    .form-head .slug { color: var(--fg-dim); font-size: 12px; }
    .form-head .kind { color: var(--primary); font-size: 11px; text-transform: uppercase; letter-spacing: .16em; }
    .form-head .kind::before { content: "// "; color: var(--fg-dim); }
    .form-head .dirty { color: var(--accent); font-size: 12px; }
    .form-head .saved { color: var(--primary); font-size: 12px; }

    .photos { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1.2rem; }
    .photos img { width: 74px; height: 74px; object-fit: cover; border: 1px solid var(--border); border-radius: 4px; }
    .photos .none { color: var(--fg-dim); font-size: 12px; align-self: center; }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: .9rem 1.4rem; max-width: 980px; }
    .field { display: flex; flex-direction: column; gap: .3rem; }
    .field.full { grid-column: 1 / -1; }
    label { color: var(--fg-dim); font-size: 11px; text-transform: uppercase; letter-spacing: .1em; }
    input, select, textarea {
      background: var(--bg-inset); border: 1px solid var(--border); color: var(--fg);
      font: inherit; padding: .5rem .65rem; border-radius: 4px; width: 100%;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--border-strong); outline: none; }
    textarea { min-height: 120px; resize: vertical; line-height: 1.55; white-space: pre-line; }
    select { appearance: auto; }
    .hint { color: var(--fg-dim); font-size: 11px; }

    /* диалоги */
    dialog { background: var(--bg-card); color: var(--fg); border: 1px solid var(--border-strong); border-radius: 6px; padding: 1.3rem 1.5rem; max-width: 460px; width: calc(100vw - 3rem); }
    dialog::backdrop { background: rgba(0,0,0,.8); }
    dialog h3 { margin: 0 0 1rem; font-size: 15px; }
    dialog .row { display: flex; gap: .8rem; margin-top: 1.2rem; justify-content: flex-end; }
    dialog .field { margin-bottom: .8rem; }
    #validate-out { white-space: pre-wrap; font-size: 12px; color: var(--fg-muted); max-height: 40vh; overflow: auto; border: 1px solid var(--border); padding: .8rem; border-radius: 4px; }
    #validate-out.ok { color: var(--primary); }
    #validate-out.err { color: var(--accent); }

    /* панель подсказок справа */
    .suggest-panel { position: sticky; top: 0; border-left: 1px solid var(--border); padding: .2rem 0 1rem 1.4rem; max-height: calc(100dvh - 1rem); overflow-y: auto; }
    .suggest-title { color: var(--fg-dim); font-size: 11px; text-transform: uppercase; letter-spacing: .12em; margin: 0 0 .5rem; }
    .suggest-title::before { content: "// "; }
    .suggest-item { display: flex; justify-content: space-between; gap: .6rem; width: 100%; text-align: left; border: none; color: var(--fg-muted); font-size: 12px; padding: .3rem .4rem; border-radius: 4px; min-height: 30px; }
    .suggest-item:hover { color: var(--primary); background: var(--primary-dim); }
    .suggest-item .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .suggest-item .n { color: var(--fg-dim); flex: none; }
    .suggest-item:hover .n { color: var(--primary); }
    .suggest-empty { color: var(--fg-dim); font-size: 12px; }

    .toast { position: fixed; bottom: 1.2rem; right: 1.2rem; background: var(--bg-card); border: 1px solid var(--primary); color: var(--primary); padding: .7rem 1.1rem; border-radius: 4px; z-index: 10; opacity: 0; transition: opacity .2s; pointer-events: none; }
    .toast.show { opacity: 1; }
    .toast.err { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>

  <header>
    <h1>ITEM<span class="dim">//</span>EDITOR</h1>
    <span class="dim" style="font-size:12px">локальный · пишет meta.json напрямую</span>
    <span class="spacer"></span>
    <button id="btn-revert" disabled title="Вернуть значения из meta.json">отменить изменения</button>
    <button id="btn-save" class="primary" disabled title="Ctrl+S">сохранить</button>
    <button id="btn-validate" title="Прогнать npm run build с валидацией">проверить сборкой</button>
    <button id="btn-new" class="primary">+ новый айтем</button>
  </header>

  <main>
    <aside>
      <div class="tree-search">
        <input id="tree-filter" type="search" placeholder="фильтр по названию…" aria-label="Фильтр дерева">
      </div>
      <nav class="tree" id="tree" aria-label="Список айтемов"></nav>
    </aside>
    <section id="form-host">
      <div class="empty">// выбери айтем слева или создай новый</div>
    </section>
  </main>

  <dialog id="new-dialog">
    <h3>// новый айтем</h3>
    <div class="field">
      <label for="new-kind">тип</label>
      <select id="new-kind">
        <option value="addons">аддон</option>
        <option value="badges">бейдж</option>
      </select>
    </div>
    <div class="field">
      <label for="new-slug">слаг папки (latiniца-дефисы)</label>
      <input id="new-slug" placeholder="oz26-addon-moj-slag" autocomplete="off">
      <span class="hint">бейдж по конвенции: {event}-{year}, напр. offzone-2027</span>
    </div>
    <div class="row">
      <button id="new-cancel">отмена</button>
      <button id="new-create" class="primary">создать</button>
    </div>
  </dialog>

  <dialog id="validate-dialog">
    <h3>// проверка сборкой</h3>
    <div id="validate-out">сборка идёт…</div>
    <div class="row"><button id="validate-close" class="primary">понятно</button></div>
  </dialog>

  <div class="toast" id="toast"></div>

  <script type="module" src="./editor.js"></script>
</body>
</html>
